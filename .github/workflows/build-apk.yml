name: Build Android APK (Cloud Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI with one click

jobs:
  build-apk:
    name: Build Standalone Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Web App & Bundle Offline Data
        run: |
          cd client
          npm run build

      - name: Grant Execute Permission to Gradle
        run: chmod +x client/android/gradlew

      - name: Copy Web Assets to Android
        run: |
          cd client
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SCP-Reader-Offline-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
